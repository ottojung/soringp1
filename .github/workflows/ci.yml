name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soringp1-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - name: Build all theorem modules, treating warnings as errors
        run: lake build --wfail
      - name: Kernel replay of proof objects
        run: lake env leanchecker SoringP1
      - name: Reject unfinished proofs and custom axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' SoringP1 SoringP1.lean; then
            echo 'Disallowed proof placeholder or axiom in Lean source'
            exit 1
          fi
