name: Research website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'recovery/**'
      - 'docs/**'
      - 'notes/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: soringp1-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build research website
        run: python3 site/build.py
      - name: Verify website and search index
        run: |
          python3 site/verify.py
          node site/test-search.js
          python3 recovery/tools/build_provenance.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
